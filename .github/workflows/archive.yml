name: Update archive and publish
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: investor-archive
  cancel-in-progress: false
jobs:
  archive:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify collector
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify browser logic and private portfolio import
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Collect roundups
        if: github.event_name != 'push'
        run: python scripts/update.py
      - uses: actions/cache@v4
        with:
          path: .model-cache
          key: semantic-model-${{ hashFiles('docs/data/ai-config.json') }}
      - name: Update local AI search index
        run: npm run build:search
      - name: Persist archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/archive.json docs/data/search-index.json
          if ! git diff --cached --quiet; then
            git commit -m "Update roundup archive"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publish
        id: publish
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
